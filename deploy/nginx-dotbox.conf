# ============================================================================
#  deploy/nginx-dotbox.conf — snippet nginx untuk situs statis dotbox
#
#  Dipasang oleh DevOps pada deploy yang disetujui CEO (2026-10-10).
#  Cara pasang: deploy/install-nginx.sh  (lihat juga deploy/DEPLOY.md).
#
#  BENTUK BERKAS INI: SNIPPET, bukan `server {}` penuh.
#  Kenapa: server dotbox disajikan di sub-path /dotbox/ pada host & port yang
#  SUDAH dipakai vhost `default` (root /var/www/html). Bila kita membuat
#  `server {}` baru dengan nama yang sama (`_`), nginx akan menuliskannya
#  sebagai "conflicting server name \"_\" ... ignored" dan mengabaikan blok
#  itu — /dotbox/ lalu 404. Kesalahan ini nyata dan sudah direproduksi.
#  Solusi yang benar: sisipkan location /dotbox/ KE DALAM server `default`
#  lewat satu baris `include` (dilakukan oleh deploy/install-nginx.sh,
#  idempoten dan reversibel).
# ============================================================================

location /dotbox/ {
    alias /var/www/dotbox/current/;
    index index.html;

    # Rilis statis: cache pendek supaya pemain cepat dapat versi baru.
    # index.html tidak di-cache sama sekali (pintu masuk selalu segar).
    location = /dotbox/index.html {
        alias /var/www/dotbox/current/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Jangan pernah mengekspos dokumen internal walau tidak ikut terbit.
    location ~* \.(?:md|txt)$ { deny all; }
}

# ---- Health endpoint: penanda versi yang bisa dipantau --------------------
# Dijawab langsung oleh nginx (bukan berkas), selalu 200 selama nginx hidup.
location = /dotbox/health {
    default_type text/plain;
    return 200 "dotbox ok\n";
}
