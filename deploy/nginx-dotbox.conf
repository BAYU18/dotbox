# ============================================================================
#  deploy/nginx-dotbox.conf — vhost nginx untuk situs statis dotbox
#
#  BELUM dipasang. DevOps memasang ini HANYA saat deploy disetujui CEO.
#  Cara pasang ada di deploy/DEPLOY.md bagian "Pasang vhost nginx".
#
#  Kenapa disajikan di sub-path /dotbox/ dan bukan akar:
#  port 80 di server ini dipakai vhost `default`. Menambah vhost baru yang
#  mengambil seluruh akar berisiko menabrak layanan lain. Sub-path = risiko
#  paling kecil dan tetap bisa diakses.
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ---- Situs dotbox: berkas statis, tanpa server-side apa pun ----------
    location /dotbox/ {
        alias /var/www/dotbox/current/;
        index index.html;

        # Rilis statis: cache pendek supaya pemain cepat dapat versi baru.
        # index.html tidak di-cache sama sekali (pintu masuk selalu segar).
        location = /dotbox/index.html {
            alias /var/www/dotbox/current/index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.(?:js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Jangan pernah mengekspos dokumen internal walau tidak ikut terbit.
        location ~* \.(?:md|txt)$ { deny all; }
    }

    # ---- Health endpoint: penanda versi yang bisa dipantau ----------------
    # Dijawab langsung oleh nginx (bukan berkas), selalu 200 selama nginx hidup.
    location = /dotbox/health {
        default_type text/plain;
        return 200 "dotbox ok\n";
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
